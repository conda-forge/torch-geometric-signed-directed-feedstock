schema_version: 1

context:
  name: torch-geometric-signed-directed
  version: "1.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/torch_geometric_signed_directed-${{ version }}.tar.gz
  sha256: ce7d2b8f478adf691c8647eb8b89f605867a05d2ce7a9108ab7d86895fc4b872

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pytorch
    - scikit-learn
    - pytorch_geometric
    - numpy
    - networkx >=2.7
    - scipy

tests:
  - python:
      imports:
        - torch_geometric_signed_directed
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: An Extension Library for PyTorch Geometric on signed and directed networks.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/SherylHYX/pytorch_geometric_signed_directed

extra:
  recipe-maintainers:
    - synapticarbors
